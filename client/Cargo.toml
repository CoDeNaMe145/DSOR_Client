[package]
name = "dsor-client"
description = "Drakensang Online client on Bevy, native and WebAssembly"
edition.workspace = true
version.workspace = true
license.workspace = true

[features]
# The browser's graphics API (no effect natively). One per build: bevy's renderer
# is specialised for it at compile time. index.html loads the WebGPU build when
# the browser has an adapter, the WebGL2 one otherwise (tools/serve_web.sh).
default = ["webgl2", "dlss"]
webgl2 = ["bevy/webgl2"]
webgpu = ["bevy/webgpu"]
# Windows/Linux Vulkan integration, on by default natively; the dependency is
# target-specific, so browser builds ignore it. Needs the NVIDIA DLSS SDK (see
# .cargo/config.toml, docs/getting-started.md); opt out with --no-default-features.
dlss = ["dep:bevy_anti_alias"]
# Per-system wall times with DSOR_FLAGS=systemprofile (crate::diagnostics::system_profile):
# bevy's tracing spans, which have a small cost of their own, so never on by default.
system-profile = ["bevy/trace"]

[dependencies]
log.workspace = true
dsor-raknet.workspace = true
dsor-proto.workspace = true
dsor-transport.workspace = true
# bevy's "3d" collection without its web backend (default_platform brings
# webgl2): the browser build picks WebGL2 or WebGPU through this crate's features.
# ui: the HUD; free_camera: WASD + mouse fly camera. Audio uses our shared PCM mixer.
bevy = { workspace = true, features = [
    "default_app", "scene", "picking", "3d_bevy_render",
    "std", "bevy_gilrs", "bevy_winit", "bevy_clipboard", "default_font", "multi_threaded",
    "x11", "wayland", "custom_cursor", "sysinfo_plugin",
    "ui", "png", "ktx2", "zstd_rust", "free_camera", "system_clipboard", "bevy_audio",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The glTF document types bevy_gltf hands to extension handlers (same version).
gltf = { version = "1.4.1", default-features = false, features = ["extras"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
dsor-level-data = { path = "../crates/level-data" }
# The original client's data from Bigpoint's CDN (the account screen's game data strip).
dsor-game-data = { path = "../crates/game-data" }
bevy_egui = { version = "=0.42.0", default-features = false, features = ["render", "default_fonts", "manage_clipboard"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Reads ?map=... from the page URL.
web-sys = { version = "0.3", features = [
    "Window", "Location", "Storage", "Performance",
    # crate::diagnostics::dump: the bug dump's download and the browser's WebGL renderer.
    "Navigator", "Document", "Element", "HtmlAnchorElement", "HtmlCanvasElement", "Blob",
    "BlobPropertyBag", "Url", "WebGl2RenderingContext",
] }
js-sys = "0.3"
wasm-bindgen = "0.2"

# Scope feature unification to native targets: bevy/dlss would also enable
# raw Vulkan initialization on wasm, even with force_disable_dlss.
[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
bevy_anti_alias = { version = "0.19", default-features = false, optional = true, features = ["dlss"] }
